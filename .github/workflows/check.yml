name: MVP quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts/generate_report.py scripts/recompute_metrics.py
      - run: ruff format --check backend scripts/generate_report.py scripts/recompute_metrics.py
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run format:check && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end ocular workflow (synthetic landmarks only)
        env:
          HEATCITY_DATA_DIR: ${{ runner.temp }}/heatcity-e2e
        run: |
          (cd backend && python -m uvicorn heatcity.api:app --host 127.0.0.1 --port 8000) > /tmp/heatcity-api.log 2>&1 &
          npm --prefix frontend run dev -- --port 5173 --strictPort > /tmp/heatcity-web.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for url in ['http://127.0.0.1:8000/health', 'http://127.0.0.1:5173']:
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2).close()
                      break
                  except OSError:
                      time.sleep(1)
              else:
                  raise SystemExit(f'Not ready: {url}')
          PY
          node frontend/scripts/mvp-smoke.mjs
